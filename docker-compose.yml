services:
  api:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DB_DSN: "barter:barter@tcp(db:3306)/barterswap?parseTime=true"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: barterswap
      MYSQL_USER: barter
      MYSQL_PASSWORD: barter
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
